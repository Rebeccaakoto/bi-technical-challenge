# Flinn BI Challenge - dbt project configuration

name: 'flinn_bi_challenge'
version: '1.0.0'
config-version: 2

profile: 'default'

# Project directory configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"


models:
  flinn_bi_challenge:
    staging:          # silver (1/2): one cleaned view per source table
      +materialized: view
      +schema: staging
    intermediate:     # silver (2/2): joins and business logic
      +materialized: view
      +schema: intermediate
    marts:            # gold: business-ready tables answering Q1-Q3
      +materialized: table
      +schema: marts